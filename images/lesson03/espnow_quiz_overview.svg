<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">ESP-NOW quiz overview</title>
  <desc id="desc">Multiple sender devices send button messages to one receiver, and the receiver forwards the messages to Unity over USB serial.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2d3748"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #2d3748; stroke-width: 3; rx: 16; }
      .sender { fill: #e6fffa; }
      .receiver { fill: #ebf8ff; }
      .unity { fill: #fff5f5; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 28px; font-weight: 700; fill: #1a202c; }
      .small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; fill: #2d3748; }
      .arrow { stroke: #2d3748; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .radio { stroke: #319795; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect x="40" y="50" width="240" height="80" class="box sender"/>
  <text x="160" y="84" text-anchor="middle" class="label">Sender A</text>
  <text x="160" y="112" text-anchor="middle" class="small">player=1,button=1</text>

  <rect x="40" y="160" width="240" height="80" class="box sender"/>
  <text x="160" y="194" text-anchor="middle" class="label">Sender B</text>
  <text x="160" y="222" text-anchor="middle" class="small">player=2,button=1</text>

  <rect x="40" y="270" width="240" height="80" class="box sender"/>
  <text x="160" y="304" text-anchor="middle" class="label">Sender C</text>
  <text x="160" y="332" text-anchor="middle" class="small">player=3,button=1</text>

  <rect x="420" y="145" width="240" height="110" class="box receiver"/>
  <text x="540" y="190" text-anchor="middle" class="label">Receiver</text>
  <text x="540" y="222" text-anchor="middle" class="small">ESP-NOW to Serial</text>

  <rect x="760" y="145" width="160" height="110" class="box unity"/>
  <text x="840" y="190" text-anchor="middle" class="label">Unity</text>
  <text x="840" y="222" text-anchor="middle" class="small">Quiz judge</text>

  <path d="M280 90 C330 90, 360 160, 420 185" class="arrow"/>
  <path d="M280 200 L420 200" class="arrow"/>
  <path d="M280 310 C330 310, 360 240, 420 215" class="arrow"/>
  <text x="350" y="172" text-anchor="middle" class="small">ESP-NOW</text>

  <path d="M660 200 L760 200" class="arrow"/>
  <text x="710" y="184" text-anchor="middle" class="small">USB Serial</text>

  <path d="M124 24 C154 4, 186 4, 216 24" class="radio"/>
  <path d="M124 136 C154 116, 186 116, 216 136" class="radio"/>
  <path d="M124 246 C154 226, 186 226, 216 246" class="radio"/>
</svg>
